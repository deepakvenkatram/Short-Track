# /ansible/roles/docker/tasks/main.yml
- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker

- name: Install Docker Engine and plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin # This is the new way to install Docker Compose
    state: present
    update_cache: yes

- name: Add user to the docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  register: user_to_docker_group

- name: Display logout message if user was added to docker group
  debug:
    msg: "User {{ ansible_user }} was added to the docker group. Please log out and log back in for this change to take effect."
  when: user_to_docker_group.changed

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes
