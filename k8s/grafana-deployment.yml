# /k8s/grafana-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        - name: init-provisioning-files
          image: busybox:1.36.1 # A small image with basic shell utilities
          command: ["sh", "-c", "set -e;
            mkdir -p /etc/grafana/provisioning/dashboards /etc/grafana/provisioning/datasources;
            cp /tmp/config/grafana.ini /etc/grafana/grafana.ini;
            cp /tmp/config/datasource.yml /etc/grafana/provisioning/datasources/datasource.yml;
            cp /tmp/config/dashboard.yml /etc/grafana/provisioning/dashboards/dashboard.yml;
            cp /tmp/dashboard/main-dashboard.json /etc/grafana/provisioning/dashboards/main-dashboard.json;
            "]
          volumeMounts:
            - name: grafana-config-volume
              mountPath: /tmp/config
            - name: grafana-dashboard-volume
              mountPath: /tmp/dashboard
            - name: grafana-config-tmp
              mountPath: /etc/grafana
      containers:
        - name: grafana
          image: grafana/grafana-oss:latest
          ports:
            - containerPort: 3000
          # Here we inject the database password as an environment variable
          # so Grafana's provisioning engine can use it in the datasource.yml
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: grafana-config-tmp
              mountPath: /etc/grafana
            # Mount for Grafana's persistent data
            - name: grafana-storage-volume
              mountPath: /var/lib/grafana
      volumes:
        # Volume for shared configuration files
        - name: grafana-config-tmp
          emptyDir: {}
        # Volume created from our first ConfigMap
        - name: grafana-config-volume
          configMap:
            name: grafana-config
        # Volume created from our second ConfigMap (for the dashboard json)
        - name: grafana-dashboard-volume
          configMap:
            name: grafana-dashboard
        # Volume using the PersistentVolumeClaim we created
        - name: grafana-storage-volume
          persistentVolumeClaim:
            claimName: grafana-pvc
