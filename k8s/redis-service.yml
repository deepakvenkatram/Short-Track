# /k8s/redis-service.yml
apiVersion: v1
kind: Service
metadata:
  name: redis-service # This name matches the REDIS_HOST in our ConfigMap
spec:
  selector:
    app: redis
  # 'clusterIP: None' makes this a "headless" service. It's used with StatefulSets
  # to allow for direct discovery of the pod's IP address.
  clusterIP: None
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
